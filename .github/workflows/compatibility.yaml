name: Companion compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Full candidate upstream SHA (empty uses pinned baseline)
        required: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: pip install -r requirements.lock -e '.[test]'
      - name: Check pinned or candidate revision
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          if [ -n "$CANDIDATE_REVISION" ]; then
            python scripts/check_upgrade.py --revision "$CANDIDATE_REVISION"
          else
            python scripts/check_upgrade.py
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compatibility-and-dashboard
          path: |
            build/compatibility.json
            build/dashboard-static
