[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmedeus-catalog"
version = "0.4.0"
description = "Independent Trafalgar catalog companion for Osmedeus"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "filelock>=3.18,<4", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bugbounty_catalog*", "catalog_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
